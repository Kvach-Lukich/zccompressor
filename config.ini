DEFAULT_OUTPATH=
# Where to save compressed files (empty = default output folder next to zccompressor)

DR=9
# Target Dynamic Range in dB (8-9 is optimal for music; below 6 is generally not music)

NORMALISE=-0.3
# Maximum peak/sample level in dB

OUTPUT_CODEC=wav
# wv / wavpack, flac, wav

OUTPUT_FORMAT=f32
# Sample format: f = float, s = signed integer, u = unsigned integer; f32 (default), s32, s24, s16

OUTPUT_WAVFORMAT=pcm_f32le
# PCM codec matching OUTPUT_FORMAT (le = little-endian, be = big-endian): pcm_f32le, pcm_s32le, pcm_s24le, pcm_s16le

OUTPUT_SAMPLERATE=0
# 44100 48000 96000 192000 88200 0 (default) = no resampling

OUTPUT_LOWCUT=0
# Low-cut / high-pass filter in Hz to remove subsonic rumble (9 Hz = one octave below 18 Hz; 20 Hz for extra clarity) 0 (default) = no filter

ADD_POSTFIXDR=false
# Append _dr9 postfix to output file name

INPUT_RESAMPLE=0
# In development

SEARCH_FREQ=20
# Peak-to-zero-crossing search window in Hz based on wavelength (higher value = narrower window; 20 Hz = 1/20 s = 50 ms). Raising it can help if the track has a sharp transient/spike at the start or end.

DITHER_METHOD=none
# none (default), rectangular, triangular, shibata, low_shibata, high_shibata, f_weighted, modified_e_weighted, improved_e_weighted