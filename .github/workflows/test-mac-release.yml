name: Test macOS Release

on:
  workflow_dispatch:

jobs:
  run-on-macos:
    runs-on: macos-latest
    steps:
      - name: Download, unpack, run scripts and pack result
        shell: bash
        run: |
          set -o pipefail

          curl -fL -o ./zccompressor.zip \
            "https://github.com/Kvach-Lukich/zccompressor/releases/download/test/zccompressor.zip"

          unzip -o ./zccompressor.zip

          cd ./zccompressor/data

          ls

          zsh ./install.command

          ls

          cd ../../

          ditto -c -k --sequesterRsrc --keepParent ./zccompressor data.zip

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: done
          follow-symlinks: false
          path: ./data.zip