[package]
name = "zccompressor"
version = "0.1.0"
edition = "2024"

[dependencies]
ez-ffmpeg = "*"
ffmpeg-sys-next ="9.1.1"
rayon = "*"
deser = { version = "*", features = ["derive"] }
deser-ini = "*"

[target.'cfg(windows)'.dependencies]
press-btn-continue = "*"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
crossterm = "*"

[target.'cfg(windows)'.build-dependencies]
winresource = "*"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
